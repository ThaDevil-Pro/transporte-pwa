<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte PWA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Splash Screen / Intro Video -->
  <div id="splash-screen">
    <video id="splash-video" autoplay loop muted playsinline webkit-playsinline preload="auto">
      <source src="intro.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Pantalla Principal de Login (Fondo Negro / Estilo Minimalista Blanco) -->
  <div class="login-container">
    
    <!-- 1. Selección de Rol -->
    <div id="role-selector" class="login-box">
      <h2>SELECCIONA TU ROL</h2>
      <div class="roles-grid">
        <button class="btn-role" data-role="Estudiante">Estudiante</button>
        <button class="btn-role" data-role="Chofer">Chofer</button>
        <button class="btn-role" data-role="Admin">Admin</button>
      </div>
    </div>

    <!-- 2. Formulario de Acceso (Oculto al inicio) -->
    <div id="login-form-box" class="login-box hidden">
      <button id="btn-back" class="btn-back">← Volver</button>

      <h2 id="login-title">INICIAR SESIÓN</h2>

      <form id="form-login">
        <div class="field">
          <label for="control-number">Número de Control / Matrícula</label>
          <input type="text" id="control-number" placeholder="Ej. 23010099" requiredautocomplete="off">
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div id="login-error" class="error-msg hidden"></div>

        <button type="submit" class="btn-submit">Ingresar</button>
      </form>
    </div>

    <!-- 3. Vista del Alumno despues de Login (Oculto al inicio) -->
    <div id="student-dashboard" class="login-box hidden">
      <h2 id="alumno-nombre">Cargando...</h2>
      <div class="qr-container">
        <canvas id="qr-canvas"></canvas>
      </div>
      <button id="btn-logout" class="btn-submit" style="margin-top: 20px;">Cerrar Sesión</button>
    </div>

  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
