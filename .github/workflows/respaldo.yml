# Respaldo semanal cifrado de la base de datos.
# Requiere los secretos:
#   SUPABASE_DB_URL     → Supabase > Project Settings > Database > Connection string
#                         (modo "Session pooler", con tu contraseña de la base de datos)
#   BACKUP_PASSPHRASE   → una frase larga que solo tú conozcas (sin ella no se puede abrir el respaldo)
# El archivo queda en la pestaña Actions del repositorio durante 90 días, CIFRADO.
#
# Para restaurar:
#   gpg --decrypt respaldo.dump.gpg > respaldo.dump
#   pg_restore --no-owner --clean --if-exists -d "<connection string>" respaldo.dump
name: Respaldo de la base de datos

on:
  schedule:
    - cron: "41 9 * * 0" # domingos, 3:41 a. m. hora del centro de México
  workflow_dispatch:

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Exportar y cifrar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_URL o BACKUP_PASSPHRASE"
            exit 1
          fi
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --schema=privado --no-owner --no-privileges -Fc -f respaldo.dump
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o respaldo.dump.gpg respaldo.dump
          rm respaldo.dump
          ls -lh respaldo.dump.gpg

      - name: Guardar respaldo cifrado
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-camify-${{ github.run_number }}
          path: respaldo.dump.gpg
          retention-days: 90
