# Evita que Supabase (plan gratis) pause el proyecto por inactividad:
# hace una consulta pequeña todos los días.
# Requiere los secretos del repositorio SUPABASE_URL y SUPABASE_ANON_KEY
# (los mismos valores de tu archivo .env).
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 * * *" # todos los días, 7:17 a. m. hora del centro de México
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL o SUPABASE_ANON_KEY"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/horarios_matriz?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Respuesta: $code"
          [ "$code" = "200" ] || { echo "::error::Supabase respondió $code (¿está pausado?)"; exit 1; }
